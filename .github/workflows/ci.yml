name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node and pnpm come from flake.nix, so CI runs the same versions as
      # `nix develop` locally.
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Lint
        run: nix develop -c pnpm lint --output-logs=errors-only
      - name: Check types
        run: nix develop -c pnpm check-types --output-logs=errors-only
      - name: Test
        run: nix develop -c pnpm test --output-logs=errors-only
      - name: Build
        run: nix develop -c pnpm build --output-logs=errors-only

  nix-build:
    name: Nix build (website, backend, image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Fails when pnpm-lock.yaml changed without updating pnpmDeps.hash.
      - run: nix build .#default .#backend .#backend-image --no-link

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      # Starts the local stack (Postgres, backend, Vite) through `stack up`
      # in its global setup; Chromium comes from the dev shell.
      - name: End-to-end tests
        run: nix develop -c pnpm test:e2e --output-logs=errors-only
      - name: Stack logs
        if: failure()
        run: tail -n 100 .dev/backend.log .dev/web.log
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: services/web/test-results/
          retention-days: 7
