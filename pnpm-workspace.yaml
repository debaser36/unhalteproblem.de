packages:
  - apps/*
  - packages/*
  - docs/*
  - services/*
  - lib/*
ignoredBuiltDependencies:
  - core-js
  - core-js-pure
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - msgpackr-extract
catalog:
  "typescript": "^7.0.2"
  "@types/node": "^25.5.2"
  "tsx": "4.21.0"
  "effect": "4.0.5"
  "@effect/tsgo": ^0.53.0
  "@effect/opentelemetry": "4.0.5"
  "@effect/platform-node": "4.0.5"
  "@effect/sql-pg": "4.0.5"
  "@effect/sql-pglite": "4.0.5"
  "@effect/vitest": "4.0.5"
  "vitest": "^5.0.4"
  "oxlint": "^1.88.0"
minimumReleaseAgeExclude:
  - prettier@3.9.1
  - "@effect/tsgo-darwin-arm64@0.53.0"
  - "@effect/tsgo-darwin-x64@0.53.0"
  - "@effect/tsgo-linux-arm64@0.53.0"
  - "@effect/tsgo-linux-arm@0.53.0"
  - "@effect/tsgo-linux-x64@0.53.0"
  - "@effect/tsgo-win32-arm64@0.53.0"
  - "@effect/tsgo-win32-x64@0.53.0"
  - "@effect/tsgo@0.53.0"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
